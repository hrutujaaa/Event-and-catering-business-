<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build Your Plate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14100D; --panel: #1D1712; --panel-raised: #241C15; --line: #3b3023;
    --ember: #f39c12; --ember-dim: #f39c12; --ember-tint: rgba(255,106,0,0.16);
    --cream: #F7F1E4; --cream-soft: #DCD0BC; --cream-dim: #B7A791; --danger: #FF7A63;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--cream); font-family:'Karla',sans-serif; -webkit-font-smoothing:antialiased; font-size:16px; }
  body { line-height:1.5; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  h1,h2,.display { font-family:'Anton', sans-serif; font-weight:400; letter-spacing:0.01em; }
  button { font-family:inherit; }
  .wrap { max-width: 1260px; margin: 0 auto; padding: 24px 20px 130px; }
  header.top { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; padding-bottom:22px; border-bottom:3px solid var(--ember); margin-bottom:26px; }
  header.top h1 { font-size:clamp(2rem,4.6vw,3.2rem); margin:0; line-height:0.95; }
  header.top h1 span { color:var(--ember); }
  header.top p.sub { margin:10px 0 0; color:var(--cream-soft); max-width:44ch; font-size:1rem; line-height:1.5; }
  .size-picker { display:flex; gap:10px; flex-wrap:wrap; }
  .size-btn { background:transparent; border:1.5px solid var(--line); color:var(--cream-soft); font-weight:600; padding:11px 16px; border-radius:5px; cursor:pointer; font-size:0.95rem; }
  .size-btn:hover { border-color:var(--ember-dim); color:var(--cream); }
  .size-btn.active { background:var(--ember); border-color:var(--ember); color:#1A1005; }

  .layout { display:grid; grid-template-columns: 240px 1fr 360px; gap:26px; align-items:start; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 220px 1fr; } .ticket-col { display:none; } }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } .nav-col { display:none; } }

  /* Step nav */
  .nav-col { position:sticky; top:20px; display:flex; flex-direction:column; gap:4px; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:14px 12px; border-radius:6px; cursor:pointer; border:1px solid transparent; background:none; text-align:left; color:var(--cream-soft); }
  .nav-item .n { font-family:'Anton',sans-serif; font-size:1.05rem; color:var(--cream-dim); width:22px; flex-shrink:0; }
  .nav-item .l { font-size:0.98rem; font-weight:600; flex-grow:1; line-height:1.3; }
  .nav-item .c { font-size:0.85rem; font-weight:700; flex-shrink:0; }
  .nav-item.active { background:var(--panel); border-color:var(--line); color:var(--cream); }
  .nav-item.active .n { color:var(--ember); }
  .nav-item .c.done { color:var(--ember); }
  .nav-item .c.warn { color:var(--danger); }
  .nav-item:hover { color: var(--cream); }

  /* Mobile top nav */
  .mobile-nav { display:none; overflow-x:auto; gap:8px; padding-bottom:12px; margin-bottom:8px; -webkit-overflow-scrolling:touch; }
  .mobile-nav .pill { flex-shrink:0; padding:10px 15px; border:1px solid var(--line); border-radius:999px; font-size:0.9rem; font-weight:600; color:var(--cream-soft); background:var(--panel); white-space:nowrap; }
  .mobile-nav .pill.active { background:var(--ember); border-color:var(--ember); color:#1A1005; }
  @media (max-width:720px) { .mobile-nav { display:flex; } }

  /* Step panel */
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:28px; min-height:420px; }
  .panel-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:8px; }
  .panel-head h2 { font-size:1.7rem; margin:0; line-height:1.2; }
  .panel-limit { font-size:0.92rem; color:var(--cream-soft); white-space:nowrap; padding-top:8px; font-weight:600; }
  .panel-limit.warn { color:var(--danger); }
  .search-input { width:100%; margin:16px 0 8px; background:var(--bg); border:1.5px solid var(--line); color:var(--cream); padding:13px 16px; border-radius:6px; font-size:1rem; }
  .search-input:focus { outline:none; border-color:var(--ember-dim); }
  .search-input::placeholder { color:var(--cream-dim); }

  .selected-strip { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; padding:14px; background:var(--ember-tint); border:1px dashed var(--ember-dim); border-radius:6px; }
  .selected-strip .empty-note { font-size:0.92rem; color:var(--cream-soft); }
  .sel-tag { display:flex; align-items:center; gap:7px; background:var(--panel-raised); border:1px solid var(--ember-dim); color:var(--cream); font-size:0.88rem; font-weight:500; padding:6px 8px 6px 13px; border-radius:999px; }
  .sel-tag button { background:none; border:none; color:var(--ember); cursor:pointer; font-size:1.1rem; line-height:1; padding:2px 4px; }

  .group-block { margin-top:24px; }
  .group-block h3 { font-family:'Karla',sans-serif; font-weight:700; font-size:1rem; color:var(--cream); margin:0 0 12px; padding-left:11px; border-left:3px solid var(--ember); line-height:1.3; }
  .option-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
  .option-row { display:flex; align-items:center; gap:13px; padding:14px 16px; border:1.5px solid var(--line); border-radius:6px; background:var(--bg); cursor:pointer; min-height:56px; }
  .option-row:hover { border-color:var(--ember-dim); }
  .option-row.selected { border-color:var(--ember); background:var(--ember-tint); }
  .option-row.disabled { opacity:0.35; cursor:not-allowed; pointer-events:none; }
  .box { flex-shrink:0; width:23px; height:23px; border:2.5px solid var(--cream-dim); position:relative; }
  .is-checkbox .box { border-radius:5px; }
  .is-radio .box { border-radius:50%; }
  .option-row.selected .box { background:var(--ember); border-color:var(--ember); }
  .option-row.selected .box::after { content:''; position:absolute; }
  .is-checkbox .option-row.selected .box::after { content:'✓'; color:#1A1005; font-size:14px; font-weight:700; left:3px; top:-2px; }
  .is-radio .option-row.selected .box::after { width:10px; height:10px; border-radius:50%; background:#1A1005; left:4.25px; top:4.25px; }
  .opt-name { flex-grow:1; font-size:1rem; font-weight:600; line-height:1.35; }
  .opt-price { font-family:'JetBrains Mono', monospace; font-size:0.92rem; color:var(--cream-soft); font-weight:600; white-space:nowrap; }
  .no-match { color:var(--cream-soft); font-size:0.98rem; padding:24px 0; }

  .panel-foot { display:flex; justify-content:space-between; margin-top:30px; padding-top:20px; border-top:1px solid var(--line); }
  .foot-btn { background:transparent; border:1.5px solid var(--line); color:var(--cream); padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.95rem; }
  .foot-btn:hover { border-color:var(--ember-dim); }
  .foot-btn.primary { background:var(--ember); border-color:var(--ember); color:#1A1005; }
  .foot-btn:disabled { opacity:0.3; cursor:not-allowed; }

  /* Ticket */
  .ticket-col { position:sticky; top:20px; }
  .ticket { background:var(--panel); border:1px solid var(--line); padding:24px 22px; border-radius:4px; }
  .ticket-edge { height:10px; margin:0 -22px; background:repeating-linear-gradient(90deg, transparent, transparent 8px, var(--bg) 8px, var(--bg) 14px); }
  .ticket-edge.bottom { margin-top:18px; }
  .ticket h2 { font-size:1.55rem; margin:0 0 6px; color:var(--ember); }
  .ticket .ticket-sub { font-size:0.92rem; color:var(--cream-soft); margin-bottom:14px; font-weight:600; }
  .ticket-line { display:flex; justify-content:space-between; gap:10px; font-size:0.94rem; padding:8px 0; border-bottom:1px dashed var(--line); }
  .ticket-line .name { color:var(--cream); font-weight:500; }
  .ticket-line .cat { color:var(--cream-soft); font-size:0.78rem; display:block; margin-bottom:2px; }
  .ticket-line .amt { font-family:'JetBrains Mono', monospace; white-space:nowrap; color:var(--cream); font-weight:600; }
  .ticket-empty { color:var(--cream-soft); font-size:0.94rem; padding:12px 0; }
  .ticket-totals { margin-top:14px; }
  .ticket-totals .row { display:flex; justify-content:space-between; font-size:0.94rem; padding:5px 0; color:var(--cream-soft); }
  .ticket-totals .row.grand { color:var(--cream); font-family:'Anton',sans-serif; font-size:1.5rem; padding-top:12px; border-top:1px solid var(--line); margin-top:8px; }
  .ticket-totals .row.grand .amt { color:var(--ember); font-family:'Anton',sans-serif; }
  .disclaimer { font-size:0.8rem; color:var(--cream-soft); margin-top:14px; line-height:1.5; }
  .send-btn { width:100%; margin-top:16px; background:var(--ember); color:#1A1005; border:none; padding:16px; font-weight:700; font-size:1.02rem; cursor:pointer; border-radius:6px; }
  .send-btn:hover { background:#FF7E1F; }
  .send-warn { font-size:0.85rem; color:var(--danger); margin-top:10px; display:none; font-weight:600; }
  .note-inline { font-size:0.78rem; color:var(--cream-soft); text-align:center; margin-top:10px; line-height:1.4; }

  /* Mobile sticky bar */
  .mobile-bar { display:none; position:fixed; left:0; right:0; bottom:0; background:var(--panel-raised); border-top:2px solid var(--ember); padding:14px 18px; align-items:center; justify-content:space-between; z-index:40; }
  .mobile-bar .total { font-family:'Anton',sans-serif; font-size:1.3rem; }
  .mobile-bar .total span { color:var(--ember); }
  .mobile-bar button { background:var(--ember); color:#1A1005; border:none; padding:13px 20px; border-radius:6px; font-weight:700; font-size:0.98rem; cursor:pointer; }
  @media (max-width:1080px) { .mobile-bar { display:flex; } }

  .sheet-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:50; }
  .sheet-overlay.open { display:block; animation:fadeIn .2s ease both; }
  .sheet { position:fixed; animation:sheetIn .28s cubic-bezier(.2,.7,.2,1) both; left:0; right:0; bottom:0; max-height:85vh; overflow-y:auto; background:var(--panel); border-top:2px solid var(--ember); border-radius:14px 14px 0 0; padding:22px; z-index:51; }
  .sheet-close { display:block; width:100%; text-align:center; background:none; border:none; color:var(--cream-soft); padding:8px 0 16px; font-size:0.95rem; font-weight:600; cursor:pointer; }

  a, button { -webkit-tap-highlight-color: transparent; }
  .send-btn:focus-visible, .foot-btn:focus-visible, .option-row:focus-within, .size-btn:focus-visible, .nav-item:focus-visible { outline:2px solid var(--cream); outline-offset:2px; }

  /* Motion + global food search */
  .top { animation: pageIn .65s cubic-bezier(.2,.7,.2,1) both; }
  .layout { animation: pageIn .75s .08s cubic-bezier(.2,.7,.2,1) both; }
  .search-shell { position:relative; width:min(100%, 520px); margin-top:18px; }
  .global-search {
    width:100%; background:var(--panel); border:1.5px solid var(--line); color:var(--cream);
    padding:14px 46px 14px 44px; border-radius:7px; font-size:1rem;
    transition:border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .global-search:hover { border-color:var(--ember-dim); }
  .global-search:focus { outline:none; border-color:var(--ember); box-shadow:0 0 0 4px var(--ember-tint); }
  .global-search-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--cream-dim); pointer-events:none; font-size:1.05rem; }
  .global-search-clear { position:absolute; right:9px; top:50%; transform:translateY(-50%); width:32px; height:32px; border:0; background:transparent; color:var(--cream-dim); cursor:pointer; border-radius:50%; }
  .global-search-clear:hover { color:var(--cream); background:var(--panel-raised); }
  .search-results {
    position:absolute; z-index:60; left:0; right:0; top:calc(100% + 8px); max-height:360px; overflow:auto;
    background:var(--panel-raised); border:1px solid var(--line); border-radius:9px; padding:8px;
    box-shadow:0 18px 50px rgba(0,0,0,.35); display:none;
  }
  .search-results.open { display:block; animation:dropIn .18s ease both; }
  .search-result {
    display:flex; align-items:center; gap:12px; width:100%; padding:12px 13px; border:0; border-radius:6px;
    background:transparent; color:var(--cream); text-align:left; cursor:pointer;
  }
  .search-result:hover, .search-result:focus-visible { background:var(--ember-tint); outline:none; }
  .search-result .result-dot { width:8px; height:8px; border-radius:50%; background:var(--ember); flex:0 0 auto; }
  .search-result .result-copy { min-width:0; flex:1; }
  .search-result .result-name { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search-result .result-meta { font-size:.78rem; color:var(--cream-soft); margin-top:2px; }
  .search-empty { padding:18px 14px; color:var(--cream-soft); font-size:.92rem; }
  .search-count { padding:7px 12px 9px; color:var(--cream-dim); font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; }
  .size-btn, .nav-item, .pill, .foot-btn, .send-btn, .mobile-bar button { transition:transform .2s ease, border-color .2s ease, background-color .2s ease, color .2s ease, box-shadow .2s ease; }
  .size-btn:active, .foot-btn:active, .send-btn:active, .mobile-bar button:active { transform:translateY(1px) scale(.99); }
  .option-row { transition:transform .2s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease; animation:optionIn .4s both; animation-delay:calc(var(--i, 0) * 22ms); }
  .option-row:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.16); }
  .option-row.selected { box-shadow:0 0 0 1px rgba(255,106,0,.12), 0 8px 22px rgba(255,106,0,.08); }
  .option-row.selected .box { animation:selectPop .25s ease both; }
  .selected-strip { animation:fadeIn .25s ease both; }
  .ticket-line { animation:slideIn .3s ease both; }
  .ticket-line:nth-child(2) { animation-delay:30ms; } .ticket-line:nth-child(3) { animation-delay:60ms; }
  .ticket-line:nth-child(4) { animation-delay:90ms; } .ticket-line:nth-child(5) { animation-delay:120ms; }
  .panel { animation:panelIn .38s cubic-bezier(.2,.7,.2,1) both; }
  .panel-head h2 { animation:fadeIn .4s .04s both; }
  @keyframes pageIn { from {opacity:0; transform:translateY(10px)} to {opacity:1; transform:none} }
  @keyframes panelIn { from {opacity:0; transform:translateY(8px)} to {opacity:1; transform:none} }
  @keyframes fadeIn { from {opacity:0} to {opacity:1} }
  @keyframes dropIn { from {opacity:0; transform:translateY(-5px) scale(.99)} to {opacity:1; transform:none} }
  @keyframes optionIn { from {opacity:0; transform:translateY(7px)} to {opacity:1; transform:none} }
  @keyframes slideIn { from {opacity:0; transform:translateX(5px)} to {opacity:1; transform:none} }
  @keyframes sheetIn { from {transform:translateY(100%)} to {transform:none} }
  @keyframes selectPop { 0% {transform:scale(.8)} 70% {transform:scale(1.08)} 100% {transform:scale(1)} }
  @media (max-width:1080px) {
    .search-shell { width:min(100%, 480px); }
    .ticket-col { display:none; }
  }
  @media (max-width:720px) {
    .wrap { padding:18px 14px 105px; }
    header.top { align-items:stretch; gap:18px; margin-bottom:18px; }
    .search-shell { width:100%; margin-top:16px; }
    .panel { padding:20px 16px; min-height:0; border-radius:7px; }
    .panel-head h2 { font-size:1.45rem; }
    .panel-limit { padding-top:4px; }
    .option-grid { grid-template-columns:1fr; gap:8px; }
    .option-row { padding:13px 14px; min-height:54px; }
    .mobile-bar { padding:11px 14px; }
    .mobile-bar .total { font-size:1.15rem; }
    .mobile-bar button { padding:11px 15px; }
    .search-results { max-height:55vh; }
  }

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>BUILD<br>YOUR <span>PLATE</span></h1>
      <p class="sub">Work through each step below — search the long lists, pick what you want, and your ticket updates as you go.</p>
      <div class="search-shell">
        <span class="global-search-icon" aria-hidden="true">⌕</span>
        <input class="global-search" id="globalSearch" type="search" autocomplete="off"
               placeholder="Search any food item…" aria-label="Search any food item">
        <button class="global-search-clear" id="globalSearchClear" type="button" aria-label="Clear search" hidden>×</button>
        <div class="search-results" id="searchResults" role="listbox" aria-label="Food search results"></div>
      </div>
    </div>
    <div class="size-picker" id="sizePicker"></div>
  </header>

  <div class="mobile-nav" id="mobileNav"></div>

  <div class="layout">
    <nav class="nav-col" id="navCol"></nav>
    <div class="panel" id="panel"></div>
    <div class="ticket-col">
      <div class="ticket">
        <div class="ticket-edge"></div>
        <h2>Your Ticket</h2>
        <div class="ticket-sub" id="ticketSize"></div>
        <div id="ticketLines"></div>
        <div class="ticket-totals" id="ticketTotals"></div>
        <div class="ticket-edge bottom"></div>
        <p class="disclaimer" id="disclaimerText"></p>
        <button class="send-btn" id="sendBtn">Send order on WhatsApp</button>
        <p class="send-warn" id="sendWarn">Please choose a base and spice level first.</p>
        <p class="note-inline">No payment happens here — we'll confirm details and send a manual invoice.</p>
      </div>
    </div>
  </div>
</div>

<div class="mobile-bar" id="mobileBar">
  <div class="total">Total: <span id="mobileTotal">$0.00</span></div>
  <button id="mobileTicketBtn">View ticket</button>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet" style="display:none;">
  <button class="sheet-close" id="sheetClose">Close</button>
  <div id="sheetContent"></div>
</div>

const state = { sizeId: DATA.sizes[1].id, selections: {}, activeStep: 0, searchTerms: {}, globalSearch: '' };
DATA.categories.forEach(c => { state.selections[c.id] = []; state.searchTerms[c.id] = ''; });

function fmt(n) { return '$' + n.toFixed(2); }


const allFoodItems = DATA.categories.flatMap((cat, step) =>
  cat.options.map(opt => ({ ...opt, categoryId: cat.id, categoryLabel: cat.label, step }))
);

function renderGlobalSearch() {
  const input = document.getElementById('globalSearch');
  const results = document.getElementById('searchResults');
  const clear = document.getElementById('globalSearchClear');
  const term = state.globalSearch.trim().toLowerCase();
  clear.hidden = !term;
  results.innerHTML = '';
  if (!term) {
    results.classList.remove('open');
    return;
  }

  const matches = allFoodItems.filter(item =>
    item.name.toLowerCase().includes(term) ||
    (item.group || '').toLowerCase().includes(term) ||
    item.categoryLabel.toLowerCase().includes(term)
  ).slice(0, 18);

  results.classList.add('open');
  if (!matches.length) {
    results.innerHTML = '<div class="search-empty">No food items found for "' +
      term.replace(/"/g, '&quot;') + '".</div>';
    return;
  }

  const count = document.createElement('div');
  count.className = 'search-count';
  count.textContent = matches.length + (matches.length === 18 ? '+' : '') + ' result' + (matches.length === 1 ? '' : 's');
  results.appendChild(count);

  matches.forEach(item => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'search-result';
    button.setAttribute('role', 'option');
    button.innerHTML =
      '<span class="result-dot"></span><span class="result-copy">' +
      '<span class="result-name"></span><span class="result-meta"></span></span>' +
      (item.price > 0 ? '<span class="opt-price">' + fmt(item.price) + '</span>' : '<span class="opt-price">included</span>');
    button.querySelector('.result-name').textContent = item.name;
    button.querySelector('.result-meta').textContent = item.categoryLabel + (item.group ? ' · ' + item.group : '');
    button.onclick = () => {
      state.activeStep = item.step;
      state.searchTerms[item.categoryId] = '';
      state.globalSearch = '';
      input.value = '';
      renderGlobalSearch();
      renderNav();
      renderPanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      setTimeout(() => document.querySelector('.panel .option-row')?.focus?.(), 350);
    };
    results.appendChild(button);
  });
}

function initGlobalSearch() {
  const input = document.getElementById('globalSearch');
  const clear = document.getElementById('globalSearchClear');
  input.oninput = e => {
    state.globalSearch = e.target.value;
    renderGlobalSearch();
  };
  input.onkeydown = e => {
    if (e.key === 'Escape') {
      state.globalSearch = '';
      input.value = '';
      renderGlobalSearch();
      input.blur();
    }
  };
  clear.onclick = () => {
    state.globalSearch = '';
    input.value = '';
    renderGlobalSearch();
    input.focus();
  };
  document.addEventListener('click', e => {
    if (!e.target.closest('.search-shell')) {
      document.getElementById('searchResults').classList.remove('open');
    }
  });
}

  el.innerHTML = '';
  DATA.sizes.forEach(s => {
    const b = document.createElement('button');
    b.className = 'size-btn' + (s.id === state.sizeId ? ' active' : '');
    b.textContent = s.name + ' · ' + fmt(s.basePrice);
    b.onclick = () => { state.sizeId = s.id; renderSizes(); renderTicket(); };
    el.appendChild(b);
  });
}

function renderNav() {
  const navCol = document.getElementById('navCol');
  const mobileNav = document.getElementById('mobileNav');
  navCol.innerHTML = ''; mobileNav.innerHTML = '';
  DATA.categories.forEach((cat, i) => {
    const done = state.selections[cat.id].length > 0;
    const item = document.createElement('button');
    item.className = 'nav-item' + (i === state.activeStep ? ' active' : '');
    item.innerHTML = '<span class="n">' + String(i+1).padStart(2,'0') + '</span><span class="l">' + cat.label + '</span><span class="c ' + (done ? 'done' : (cat.required ? 'warn' : '')) + '">' + (done ? '✓' : (cat.required ? '!' : '')) + '</span>';
    item.onclick = () => { state.activeStep = i; renderNav(); renderPanel(); };
    navCol.appendChild(item);

    const pill = document.createElement('button');
    pill.className = 'pill' + (i === state.activeStep ? ' active' : '');
    pill.textContent = (i+1) + '. ' + cat.label + (done ? ' ✓' : '');
    pill.onclick = () => { state.activeStep = i; renderNav(); renderPanel(); };
    mobileNav.appendChild(pill);
  });
}

function toggleOption(cat, opt) {
  const sel = state.selections[cat.id];
  const idx = sel.indexOf(opt.id);
  if (idx >= 0) {
    sel.splice(idx, 1);
  } else {
    if (cat.selectionType === 'single') {
      state.selections[cat.id] = [opt.id];
    } else {
      if (cat.maxSelect && sel.length >= cat.maxSelect) return;
      sel.push(opt.id);
    }
  }
  renderNav(); renderPanel(); renderTicket();
}

function renderPanel() {
  const cat = DATA.categories[state.activeStep];
  const panel = document.getElementById('panel');
  panel.innerHTML = '';
  panel.className = 'panel ' + (cat.selectionType === 'single' ? 'is-radio' : 'is-checkbox');

  const head = document.createElement('div');
  head.className = 'panel-head';
  const atMax = cat.maxSelect && state.selections[cat.id].length >= cat.maxSelect;
  head.innerHTML = '<h2>' + (state.activeStep+1) + '. ' + cat.label + '</h2>' +
    '<div class="panel-limit' + (atMax ? ' warn' : '') + '">' +
      (cat.selectionType === 'single' ? 'Choose 1' + (cat.required ? ' (required)' : '') :
        'Choose up to ' + cat.maxSelect + (cat.freeIncluded ? ' · first ' + cat.freeIncluded + ' free' : '') +
        (atMax ? ' — limit reached' : '')) +
    '</div>';
  panel.appendChild(head);

  if (cat.options.length > 15) {
    const search = document.createElement('input');
    search.className = 'search-input';
    search.placeholder = 'Search ' + cat.label.toLowerCase() + '…';
    search.value = state.searchTerms[cat.id];
    search.oninput = (e) => { state.searchTerms[cat.id] = e.target.value; renderPanel(); };
    panel.appendChild(search);
  }

  const chosen = state.selections[cat.id].map(id => cat.options.find(o => o.id === id)).filter(Boolean);
  const strip = document.createElement('div');
  strip.className = 'selected-strip';
  if (chosen.length === 0) {
    strip.innerHTML = '<span class="empty-note">Nothing picked yet in this step.</span>';
  } else {
    chosen.forEach(o => {
      const tag = document.createElement('span');
      tag.className = 'sel-tag';
      tag.innerHTML = o.name + ' <button aria-label="remove">×</button>';
      tag.querySelector('button').onclick = () => toggleOption(cat, o);
      strip.appendChild(tag);
    });
  }
  panel.appendChild(strip);

  const term = state.searchTerms[cat.id].trim().toLowerCase();
  const groupsMap = new Map();
  cat.options.forEach(o => {
    const g = o.group || '';
    if (!groupsMap.has(g)) groupsMap.set(g, []);
    groupsMap.get(g).push(o);
  });

  let anyVisible = false;
  groupsMap.forEach((opts, groupLabel) => {
    const visible = term ? opts.filter(o => o.name.toLowerCase().includes(term)) : opts;
    if (visible.length === 0) return;
    anyVisible = true;
    const block = document.createElement('div');
    block.className = 'group-block';
    if (groupLabel) {
      const h3 = document.createElement('h3');
      h3.textContent = groupLabel;
      block.appendChild(h3);
    }
    const grid = document.createElement('div');
    grid.className = 'option-grid';
    visible.forEach(opt => {
      const selected = state.selections[cat.id].includes(opt.id);
      const disabled = !selected && cat.maxSelect && state.selections[cat.id].length >= cat.maxSelect && cat.selectionType !== 'single';
      const row = document.createElement('label');
      row.className = 'option-row' + (selected ? ' selected' : '') + (disabled ? ' disabled' : '');
      row.style.setProperty('--i', grid.children.length);
      row.innerHTML = '<span class="box"></span><span class="opt-name">' + opt.name + '</span>' +
        (opt.price > 0 ? '<span class="opt-price">' + fmt(opt.price) + '</span>' : '<span class="opt-price">included</span>');
      row.onclick = () => toggleOption(cat, opt);
      grid.appendChild(row);
    });
    block.appendChild(grid);
    panel.appendChild(block);
  });

  if (!anyVisible) {
    const nm = document.createElement('div');
    nm.className = 'no-match';
    nm.textContent = 'No matches for "' + state.searchTerms[cat.id] + '".';
    panel.appendChild(nm);
  }

  const foot = document.createElement('div');
  foot.className = 'panel-foot';
  const prevBtn = document.createElement('button');
  prevBtn.className = 'foot-btn';
  prevBtn.textContent = 'Back';
  prevBtn.disabled = state.activeStep === 0;
  prevBtn.onclick = () => { state.activeStep--; renderNav(); renderPanel(); window.scrollTo({top:0, behavior:'smooth'}); };
  const nextBtn = document.createElement('button');
  nextBtn.className = 'foot-btn primary';
  nextBtn.textContent = state.activeStep === DATA.categories.length - 1 ? 'Done' : 'Next: ' + DATA.categories[Math.min(state.activeStep+1, DATA.categories.length-1)].label;
  nextBtn.onclick = () => {
    if (state.activeStep < DATA.categories.length - 1) { state.activeStep++; renderNav(); renderPanel(); window.scrollTo({top:0, behavior:'smooth'}); }
    else { openSheet(); }
  };
  foot.appendChild(prevBtn); foot.appendChild(nextBtn);
  panel.appendChild(foot);
}

function categoryCost(cat) {
  const chosen = state.selections[cat.id].map(id => cat.options.find(o => o.id === id)).filter(Boolean).sort((a,b) => a.price - b.price);
  const free = cat.freeIncluded || 0;
  return chosen.slice(free).reduce((sum,o) => sum + o.price, 0);
}

function ticketMarkup() {
  const size = DATA.sizes.find(s => s.id === state.sizeId);
  let linesHtml = '';
  let any = false;
  DATA.categories.forEach(cat => {
    const chosen = state.selections[cat.id].map(id => cat.options.find(o => o.id === id)).filter(Boolean);
    chosen.forEach(o => {
      any = true;
      linesHtml += '<div class="ticket-line"><span><span class="cat">' + cat.label + '</span><span class="name">' + o.name + '</span></span><span class="amt">' + (o.price > 0 ? fmt(o.price) : '—') + '</span></div>';
    });
  });
  if (!any) linesHtml = '<div class="ticket-empty">Nothing picked yet — start with your base.</div>';

  const categorySubtotal = DATA.categories.reduce((sum,c) => sum + categoryCost(c), 0);
  const subtotal = size.basePrice + categorySubtotal;
  const tax = subtotal * (DATA.pricingRules.taxRatePercent / 100);
  const total = subtotal + tax + (DATA.pricingRules.serviceFeeFlat || 0);
  state._total = total; state._size = size;

  const totalsHtml =
    '<div class="row"><span>Base (' + size.name + ')</span><span class="amt">' + fmt(size.basePrice) + '</span></div>' +
    '<div class="row"><span>Add-ons</span><span class="amt">' + fmt(categorySubtotal) + '</span></div>' +
    '<div class="row"><span>Tax (' + DATA.pricingRules.taxRatePercent + '%)</span><span class="amt">' + fmt(tax) + '</span></div>' +
    '<div class="row grand"><span>Total</span><span class="amt">' + fmt(total) + '</span></div>';

  return { linesHtml, totalsHtml, size, total };
}

function renderTicket() {
  const { linesHtml, totalsHtml, size, total } = ticketMarkup();
  document.getElementById('ticketSize').textContent = size.name + ' plate';
  document.getElementById('ticketLines').innerHTML = linesHtml;
  document.getElementById('ticketTotals').innerHTML = totalsHtml;
  document.getElementById('disclaimerText').textContent = DATA.pricingRules.estimateDisclaimer;
  document.getElementById('mobileTotal').textContent = fmt(total);
  if (document.getElementById('sheet').style.display !== 'none') renderSheet();
}

function renderSheet() {
  document.getElementById('sheetContent').innerHTML =
    '<div class="ticket-edge"></div><h2 style="color:var(--ember)">Your Ticket</h2><div id="sheetLines"></div><div id="sheetTotals" class="ticket-totals"></div><button class="send-btn" id="sendBtnMobile">Send order on WhatsApp</button><p class="send-warn" id="sendWarnMobile">Please choose a base and spice level first.</p>';
  const { linesHtml, totalsHtml } = ticketMarkup();
  document.getElementById('sheetLines').innerHTML = linesHtml;
  document.getElementById('sheetTotals').innerHTML = totalsHtml;
  document.getElementById('sendBtnMobile').onclick = sendOrder;
}

function openSheet() {
  document.getElementById('sheet').style.display = 'block';
  document.getElementById('sheetOverlay').classList.add('open');
  renderSheet();
}
function closeSheet() {
  document.getElementById('sheet').style.display = 'none';
  document.getElementById('sheetOverlay').classList.remove('open');
}
document.getElementById('mobileTicketBtn').onclick = openSheet;
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetOverlay').onclick = closeSheet;

function requiredMet() {
  return DATA.categories.filter(c => c.required).every(c => state.selections[c.id].length > 0);
}

function sendOrder() {
  if (!requiredMet()) {
    document.getElementById('sendWarn').style.display = 'block';
    const mw = document.getElementById('sendWarnMobile');
    if (mw) mw.style.display = 'block';
    const firstMissing = DATA.categories.findIndex(c => c.required && state.selections[c.id].length === 0);
    if (firstMissing >= 0) { state.activeStep = firstMissing; renderNav(); renderPanel(); closeSheet(); window.scrollTo({top:0, behavior:'smooth'}); }
    return;
  }
  const size = state._size;
  const parts = [];
  DATA.categories.forEach(cat => {
    const chosen = state.selections[cat.id].map(id => cat.options.find(o => o.id === id)).filter(Boolean);
    if (chosen.length) parts.push(cat.label + ': ' + chosen.map(o => o.name).join(', '));
  });
  const summary = size.name + ' plate\n' + parts.join('\n');
  const msg = DATA.leadCapture.messageTemplate
    .replace('{plateSummary}', summary).replace('{estimatedTotal}', fmt(state._total))
    .replace('{customerName}', '').replace('{customerPhone}', '');
  const phone = DATA.leadCapture.whatsappNumber.replace(/[^0-9]/g, '');
  window.open('https://wa.me/' + phone + '?text=' + encodeURIComponent(msg), '_blank');
}
document.getElementById('sendBtn').onclick = sendOrder;

renderSizes(); renderNav(); renderPanel(); renderTicket(); initGlobalSearch();
</script>
</body>
</html>
